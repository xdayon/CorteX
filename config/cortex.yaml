app:
  name: CorteX
  api_prefix: /api/v1
  host: 127.0.0.1
  port: 8787

paths:
  data_dir: data
  projects_dir: data/projects
  cache_dir: data/cache
  output_dir: data/output
  database: data/cortex.sqlite3

transcription:
  model: large-v3-turbo
  language: pt
  device: cuda
  compute_type: int8
  batch_size: 8
  vad: true
  allow_cpu_fallback: false
  hotwords: [Dayon]

ingest:
  max_upload_bytes: 10737418240
  allowed_extensions: [mp4, mov, mkv, webm, mp3, wav, m4a, aac, flac]
  youtube_format: "bestvideo[height<=1440][ext=mp4]+bestaudio[ext=m4a]/bestvideo[height<=1440]+bestaudio/best[height<=1440]/best"
  # Cookies do Chrome (Flatpak) logado no YouTube: evita o "Sign in to confirm you're not a bot".
  youtube_cookies_from_browser: "chrome:~/.var/app/com.google.Chrome/config/google-chrome"

render:
  ffmpeg: /usr/bin/ffmpeg
  ffprobe: /usr/bin/ffprobe
  fonts_dir: assets/fonts
  # NVENC indisponível desde 02/out/2026: o FFmpeg 8.1.3 do Bazzite exige a API
  # NVENC 13.1 (driver >= 610) e a GTX 1060 (Pascal) termina no driver 580 (API 13.0).
  # Ver docs/evidence/2026-10-14-host-nvenc.md antes de voltar para h264_nvenc.
  encoder: libx264
  allow_cpu_fallback: false
  width: 1080
  height: 1920
  fps: 30
  loudness_target_lufs: -14.0
  loudness_tolerance_lu: 1.0
  true_peak_limit_dbfs: -1.0
  captions_enabled: true
  caption_font: Montserrat
  caption_font_size: 56
  caption_max_words: 5
  headline_enabled: true
  headline_font: Montserrat
  headline_font_size: 48
  headline_duration_seconds: 4.0
  visual_quality_enabled: true
  black_threshold_seconds: 0.5
  freeze_threshold_seconds: 1.5
  freeze_block_threshold_seconds: 5.0
  safe_zone_sample_fps: 4.0

clips:
  minimum_seconds: 40
  maximum_seconds: 120
  count: 10
  pacing_profile: auto

# Índice de cenas (cortes de câmera) via filtro scdet do FFmpeg.
# scene_threshold: sensibilidade do scdet (0-100, escala nativa do filtro).
#   Valor mais baixo detecta mais cortes; 10.0 é o default do próprio scdet.
analysis:
  scene_threshold: 10.0

# scene_snap_tolerance_seconds: raio (em segundos) em que uma fronteira de
#   vídeo da EDL pode ser ajustada para o corte de cena mais próximo do
#   scene_index, sempre que isso não violar fala/VAD.
edit:
  scene_snap_tolerance_seconds: 0.5

ai:
  provider: claude_code_cli
  # Resolvido em ordem: PATH, ~/.local/bin, alias default do fnm, extensão do editor.
  claude_binary: claude
  claude_model: claude-sonnet-5-5
  claude_effort: medium
  refine_effort: medium
  tighten_enabled: true
  codex_binary: codex
  codex_model: gpt-5.5
  codex_reasoning_effort: medium
  timeout_seconds: 900
  max_input_chars: 800000
  selection_max_envelope_seconds: 240.0

# Reconhecimento rápido da voz do protagonista (embeddings WeSpeaker no ambiente
# .venv-diarization) no lugar da diarização completa; usa data/voice/profile.json.
voice:
  match_enabled: true
  default_threshold: 0.37
  max_threads: 8
  timeout_seconds: 1800

# Lições de matemática em vídeo (python -m cortex.lessons): clipes do Flow + Manim
# + narração ElevenLabs + música. Cortes derivados do alinhamento palavra a palavra.
lessons:
  dir: data/lessons
  ingest_dir: ~/Downloads/ingest
  language: en
  lead_in_seconds: 0.8
  flow_durations: [4, 6, 8, 10]
  flow_max_retime: 1.1
  fps: 30
  width: 1920
  height: 1080
  xfade_seconds: 0.4
  voice_lufs: -14.0
  music_lufs: -31.0
  # Promos (lesson.json com "sound"): música mais presente, abaixada sob a voz (ducking),
  # e cada efeito nivelado pelo trecho mais alto de 400 ms antes da normalização final.
  ducked_music_lufs: -20.0
  sfx_lufs: -16.0
  target_lufs: -14.0
  true_peak_db: -1.0
  manim_image: docker.io/manimcommunity/manim:v0.19.0
  manim_workers: 4

# Biblioteca de som (python -m cortex.sound): Soundza (principal) + SFXMint, arquivos
# baixados e kits curados. Chave SOUNDZA_API_KEY no .env (comando login).
sound:
  dir: data/sound
  default_kit: dayon
  http_timeout_seconds: 30.0
  max_retry_wait_seconds: 30.0
  max_download_mb: 60.0
  candidates_per_query: 12
  reel_lufs: -16.0
