app:
  name: CorteX
  api_prefix: /api/v1
  host: 127.0.0.1
  port: 8787

paths:
  data_dir: data
  projects_dir: data/projects
  cache_dir: data/cache
  output_dir: data/output
  database: data/cortex.sqlite3

transcription:
  model: large-v3-turbo
  language: pt
  device: cuda
  compute_type: int8
  batch_size: 8
  vad: true
  allow_cpu_fallback: false

ingest:
  max_upload_bytes: 10737418240
  allowed_extensions: [mp4, mov, mkv, webm, mp3, wav, m4a, aac, flac]
  youtube_format: "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best"

render:
  ffmpeg: /usr/bin/ffmpeg
  ffprobe: /usr/bin/ffprobe
  remotion_node: node
  remotion_browser: /var/home/dx/.cache/puppeteer/chrome-headless-shell/linux-147.0.7727.57/chrome-headless-shell-linux64/chrome-headless-shell
  remotion_app_dir: apps/remotion
  encoder: h264_nvenc
  allow_cpu_fallback: false
  width: 1080
  height: 1920
  fps: 30
  loudness_target_lufs: -14.0
  loudness_tolerance_lu: 1.0
  true_peak_limit_dbfs: -1.0
  captions_enabled: true
  caption_font: Montserrat
  caption_font_size: 32
  caption_max_words: 5
  headline_enabled: true
  headline_font: Montserrat
  headline_font_size: 42
  headline_duration_seconds: 3.4
  visual_quality_enabled: true
  black_threshold_seconds: 0.5
  freeze_threshold_seconds: 1.5
  safe_zone_sample_fps: 4.0

clips:
  minimum_seconds: 50
  maximum_seconds: 120
  count: 10
  pacing_profile: auto

# Índice de cenas (cortes de câmera) via filtro scdet do FFmpeg.
# scene_threshold: sensibilidade do scdet (0-100, escala nativa do filtro).
#   Valor mais baixo detecta mais cortes; 10.0 é o default do próprio scdet.
# face_sample_fps: grade esparsa do índice de faces.
# speaker_sample_fps: amostragem densa apenas em chunks VAD para mouth motion.
# speaker_vad_padding_seconds: contexto visual antes/depois da fala para baseline
#   e busca conservadora de reactions em silencio adjacente.
# visual_quality_sample_fps: grade para preto, blur e congelamento por cena.
# multicam_*: janela de busca e limite de audio usado para sincronizar fontes ISO.
analysis:
  scene_threshold: 10.0
  face_sample_fps: 1.0
  speaker_sample_fps: 4.0
  speaker_vad_padding_seconds: 1.0
  visual_quality_sample_fps: 2.0
  multicam_max_offset_seconds: 120.0
  multicam_analysis_seconds: 600.0

# scene_snap_tolerance_seconds: raio (em segundos) em que uma fronteira de
#   vídeo da EDL pode ser ajustada para o corte de cena mais próximo do
#   scene_index, sempre que isso não violar fala/VAD.
edit:
  scene_snap_tolerance_seconds: 0.5

ai:
  provider: codex_cli
  fallback_provider: claude_cli
  codex_binary: codex
  codex_model: gpt-5.5
  codex_reasoning_effort: medium
  claude_binary: claude
  claude_model: fable
  claude_effort: low
  timeout_seconds: 300
  max_input_chars: 800000
